[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -ra
markers =
    ui: browser user-interface tests (Playwright)
    smoke: route-render smoke checks (one case per navigable route)
    auth: authentication UI flow
    roles: role-based dashboard & access-control UI (registrar, physician, nurse, admin, midwife, lab)
